services:
  windows:
    image: dockurr/windows:6.05@sha256:0cff9eb0e7aee9953e55bc682852ca4fdca233145a58ae1ec94f0b0c01a2ed30
    container_name: windows
    hostname: windows
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
    environment:
      VERSION: "${WINDOWS_VERSION:-11}"
      USERNAME: "${WINDOWS_USERNAME:-Docker}"
      PASSWORD: "${WINDOWS_PASSWORD:?set WINDOWS_PASSWORD in .env}"
      LANGUAGE: "${WINDOWS_LANGUAGE:-English}"
      DISK_SIZE: "${WINDOWS_DISK_SIZE:-64G}"
      RAM_SIZE: "${WINDOWS_RAM_SIZE:-4G}"
      CPU_CORES: "${WINDOWS_CPU_CORES:-2}"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    volumes:
      - ./data:/storage
    restart: unless-stopped
    stop_grace_period: 2m
